plugins { id 'com.android.application' }
android {
    namespace 'com.denberg.beyondthefence'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.denberg.beyondthefence'
        minSdk 26
        targetSdk 35
        versionCode 19
        versionName '0.14.0-rc.2'
        testInstrumentationRunner 'com.denberg.beyondthefence.SmokeInstrumentation'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError true
        warningsAsErrors true
        // Pinned API35 toolchain; this MVP does not target Play Store publication.
        disable 'NewerVersionAvailable', 'GradleDependency', 'OldTargetApi'
    }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
apply from: rootProject.file('scripts/score.gradle')
