name: Android candidate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      publish: ${{ steps.identity.outputs.publish }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Select verified signing payload, if present
        id: identity
        run: |
          python3 - <<'PYCODE'
          import json, os, pathlib, re, subprocess
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          parent=subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
          path=pathlib.Path('release/publish.json')
          payload=json.loads(path.read_text()) if path.exists() else {}
          source=payload.get('source_sha','')
          publish=False
          if re.fullmatch('[0-9a-f]{40}',source) and source!=head and subprocess.run(['git','merge-base','--is-ancestor',source,head]).returncode==0:
            changed=set(subprocess.check_output(['git','diff','--name-only',source,head],text=True).splitlines())
            publish=changed <= {'release/publish.json','.github/workflows/android.yml'}
          if publish:
            pathlib.Path(os.environ['RUNNER_TEMP'],'btf-publish.json').write_text(json.dumps(payload))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
            out.write('publish='+str(publish).lower()+'\nsource_sha='+(source if publish else head)+'\n')
          PYCODE
      - name: Check out the verified game source
        if: steps.identity.outputs.publish == 'true'
        run: git checkout --detach '${{ steps.identity.outputs.source_sha }}'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          log-accepted-android-sdk-licenses: false
      - name: Install pinned SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Build, unit tests and lint
        run: ./gradlew --no-daemon testDebugUnitTest testReleaseUnitTest assembleDebug assembleDebugAndroidTest assembleRelease lintDebug lintRelease
      - name: Verify fixed-key payload against freshly built source
        if: steps.identity.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare_signed_candidate.py "$RUNNER_TEMP/btf-publish.json" "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar"
      - name: Audit package and signature
        run: |
          python3 scripts/check_package.py "$ANDROID_HOME/build-tools/35.0.0/aapt" app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/check_package.py "$ANDROID_HOME/build-tools/35.0.0/aapt" app/build/outputs/apk/release/app-release-unsigned.apk --release
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          if [ '${{ steps.identity.outputs.publish }}' = true ]; then
            python3 scripts/check_package.py "$ANDROID_HOME/build-tools/35.0.0/aapt" artifacts/TAG-Zombie-Survival-Fantasy-0.16.1-rc.1-Release.apk --release
          fi
          git diff --exit-code
      - name: Package exact source and candidate
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/TAG-Zombie-Survival-Fantasy-0.16.1-rc.1-Preview.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk artifacts/TAG-Zombie-Survival-Fantasy-0.16.1-rc.1-Tests.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/TAG-Zombie-Survival-Fantasy-0.16.1-rc.1-Unsigned.apk
          git archive --format=zip HEAD -o artifacts/TAG-Zombie-Survival-Fantasy-0.16.1-rc.1-Source.zip
          cp docs/RELEASE-NOTES.md artifacts/RELEASE-NOTES.md
          cp app/build/test-results/testDebugUnitTest/*.xml artifacts/
          for report in app/build/test-results/testReleaseUnitTest/*.xml; do cp "$report" "artifacts/Release-$(basename "$report")"; done
          printf 'commit=%s\nversion=0.16.1-rc.1\napplicationId=com.denberg.beyondthefence\nminSdk=26\ntargetSdk=35\nJDK=17\nGradle=8.9\nAGP=8.7.3\nbuildTools=35.0.0\ntier=prerelease\nsigning=see certificate/payload evidence\n' '${{ steps.identity.outputs.source_sha }}' > artifacts/BUILD-INFO.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs artifacts/*Preview.apk >> artifacts/BUILD-INFO.txt
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" artifacts/apksigner.jar
          cp docs/signing-certificate.sha256 artifacts/signing-certificate.sha256
          if [ '${{ steps.identity.outputs.publish }}' = true ]; then printf 'fixed private key; public certificate pinned\n' >> artifacts/BUILD-INFO.txt; fi
          cd artifacts
          sha256sum ./* > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-build
          path: artifacts/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: app/build/reports/
  emulator:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: candidate-build
          path: artifacts
      - name: Verify artifact integrity
        run: cd artifacts && sha256sum -c SHA256SUMS.txt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          log-accepted-android-sdk-licenses: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/emulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-api-${{ matrix.api }}
          path: evidence/
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.publish == 'true'
    needs: [build, emulator]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: candidate-build
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: emulator-api-*
          path: evidence
      - name: Publish immutable test candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          sha256sum -c SHA256SUMS.txt
          cd ..
          if gh release view v0.16.1-rc.1 >/dev/null 2>&1; then
            echo 'Version already published; preserving existing release. Bump version to publish changes.'
            exit 0
          fi
          printf 'PASS: unit tests, debug/release builds, lint, package audit, APK signature\nPASS: native tile touch, orientation/font, lifecycle/checkpoint tests on API 26 and 35 emulators; actual signed release install-r upgrade\nBLOCKED: physical handset endurance, TalkBack/font/device performance, physical-phone playtesting\nEvidence: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > artifacts/VERIFICATION.txt
          python3 - <<'PYCODE'
          import os, pathlib
          text=pathlib.Path('docs/RELEASE-NOTES.md').read_text().split('\nRequired candidate checks:')[0]
          text+='\nMove only the map pond to the right, with 16dp south-fence clearance and space above Plant.\n'
          text+='\nValidation passed: unit tests in each build variant; builds, lint, package/audio audits; pinned signing certificate and exact compiled-content comparison; full installed-app suites on API26 and35; actual non-debuggable release installation and checkpoint retention.\n'
          text+='\nInstall Release.apk on Android8.0 or newer. Export a save backup before updating. The retained signing identity supports same-key updates; older disposable-key previews require one-time save transfer.\n'
          text+='\nPrerelease: physical-phone endurance, accessibility, audio/performance and human balance playtesting remain pending.\n'
          text+='\nEvidence: '+os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']+'\n'
          pathlib.Path('artifacts/RELEASE-NOTES.md').write_text(text)
          PYCODE
          rm -f artifacts/Upgrade-Baseline.apk artifacts/apksigner.jar
          zip -r artifacts/TAG-Zombie-Survival-Fantasy-0.16.1-rc.1-Emulator-Evidence.zip evidence
          cd artifacts
          rm SHA256SUMS.txt
          sha256sum ./* > SHA256SUMS.txt
          cd ..
          gh release create v0.16.1-rc.1 artifacts/* --target '${{ github.sha }}'  --prerelease --title 'TAG: Zombie Survival Fantasy 0.16.1-rc.1 — Right-side pond spacing' --notes-file artifacts/RELEASE-NOTES.md
