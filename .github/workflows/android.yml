name: Android candidate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          log-accepted-android-sdk-licenses: false
      - name: Install pinned SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Build, unit tests and lint
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest assembleRelease lintDebug lintRelease
      - name: Audit package and signature
        run: |
          python3 scripts/check_package.py "$ANDROID_HOME/build-tools/35.0.0/aapt" app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          git diff --exit-code
      - name: Package exact source and candidate
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/Beyond-the-Fence-0.1.0-rc.2-Preview.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk artifacts/Beyond-the-Fence-0.1.0-rc.2-Tests.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/Beyond-the-Fence-0.1.0-rc.2-Unsigned.apk
          git archive --format=zip HEAD -o artifacts/Beyond-the-Fence-0.1.0-rc.2-Source.zip
          cp docs/RELEASE-NOTES.md artifacts/RELEASE-NOTES.md
          cp app/build/test-results/testDebugUnitTest/*.xml artifacts/
          printf 'commit=%s\nversion=0.1.0-rc.2\napplicationId=com.denberg.beyondthefence\nminSdk=26\ntargetSdk=35\nJDK=17\nGradle=8.9\nAGP=8.7.3\nbuildTools=35.0.0\ntier=prerelease\nsigning=debug test only\n' "$GITHUB_SHA" > artifacts/BUILD-INFO.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs artifacts/*Preview.apk >> artifacts/BUILD-INFO.txt
          cd artifacts
          sha256sum ./* > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-build
          path: artifacts/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: app/build/reports/
  emulator:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: candidate-build
          path: artifacts
      - name: Verify artifact integrity
        run: cd artifacts && sha256sum -c SHA256SUMS.txt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          log-accepted-android-sdk-licenses: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/emulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-api-${{ matrix.api }}
          path: evidence/
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, emulator]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: candidate-build
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: emulator-api-*
          path: evidence
      - name: Publish immutable test candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          sha256sum -c SHA256SUMS.txt
          cd ..
          if gh release view v0.1.0-rc.2 >/dev/null 2>&1; then
            echo 'Version already published; preserving existing release. Bump version to publish changes.'
            exit 0
          fi
          printf 'PASS: unit tests, debug/release builds, lint, package audit, APK signature\nPASS: native UI/lifecycle/checkpoint tests on API 26 and 35 emulators\nBLOCKED: physical handset endurance, TalkBack/font/device performance, production signing\nEvidence: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > artifacts/VERIFICATION.txt
          zip -r artifacts/Beyond-the-Fence-0.1.0-rc.2-Emulator-Evidence.zip evidence
          cd artifacts
          rm SHA256SUMS.txt
          sha256sum ./* > SHA256SUMS.txt
          cd ..
          gh release create v0.1.0-rc.2 artifacts/* --target "$GITHUB_SHA" --prerelease --title 'Beyond the Fence 0.1.0-rc.2 — Android preview' --notes-file docs/RELEASE-NOTES.md
